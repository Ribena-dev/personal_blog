<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ page.title }} | {{ site.title }}</title>
  {% if page.lead %}<meta name="description" content="{{ page.lead | strip_html | escape }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/guide.css' | relative_url }}">
</head>
<body>
<div class="layout">
  <nav class="toc" aria-label="Sections" id="toc">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <!-- section links are filled in by guide.js from the h2 headings -->
    <button class="theme-btn" id="themeBtn" type="button">Toggle dark mode</button>
  </nav>

  <main>
    <header class="hero">
      <h1>{{ page.title }}</h1>
      {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
      {% if page.date %}<p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>{% endif %}
    </header>

    <article class="content">
      {{ content }}
    </article>
  </main>
</div>
<script src="{{ '/assets/js/guide.js' | relative_url }}"></script>
</body>
</html>
