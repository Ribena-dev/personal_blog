---
layout : index_layout
title: landing page
---
<header class="hero">
  <div class="wrap">
    <h1>Hi, I'm Devinaa</h1>
    <p>
        small intro about myself
    </p>
    <p> another small tag on</p>
    <div class="status">
      <span class="dot"></span>
      
    </div>
  </div>
</header>

<section class="work" id="work">
  <div class="wrap">
    <h2 class="eyebrow">projects</h2>

    {% for post in site.posts %}
    <a class="case" href="./_posts">
      <div class="tag">{{ post.tag }}</div>
      <h3>{{ post.title }}</h3>
      <p>{{ post.summary }}</p>
      <span class="cta">View projects</span>
    </a>
    {% endfor %}

  </div>
</section>
